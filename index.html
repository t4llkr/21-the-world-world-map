<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dream map — исследователь локаций</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="logo">&#9790; dream map</span>
    <button id="fitBtn" class="btn">Вписать в экран</button>
    <label class="chk"><input type="checkbox" id="labelChk" checked> подписи</label>
    <label class="chk"><input type="checkbox" id="physChk" checked> физика</label>
    <label class="chk"><input type="checkbox" id="bgChk" checked> фон</label>
    <label class="chk">раскладка
      <select id="layoutSel">
        <option value="cone" selected>конус (3D-дерево)</option>
        <option value="radial">радиальная</option>
        <option value="force">force-directed</option>
      </select>
    </label>
    <label class="chk" style="display:none">сортировка
      <select id="sortSel">
        <option value="default" selected>по файлу</option>
        <option value="name">по имени</option>
        <option value="version">по версии v1→v4</option>
        <option value="degree">по числу переходов</option>
        <option value="effects">по сумме эффектов</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="mode3dChk"> 3D</label>
    <span id="graphStats"></span>
  </div>
  <div id="main">
    <div id="bg"></div>
    <canvas id="bgGl"></canvas>
    <canvas id="canvas"></canvas>
    <aside id="side">
      <div>
        <input id="search" placeholder="Поиск локации…" autocomplete="off">
        <div id="searchResults"></div>
      </div>
      <section><h3>Локация</h3><div id="nodePanel" class="card"><span class="hint">кликните по ноде на графе</span></div></section>
      <section><h3>Кратчайший путь</h3><div id="pathPanel" class="card"></div></section>
      <section><h3>Проход</h3><div id="walkPanel" class="card"></div></section>
      <section><h3>Легенда</h3><div id="legendPanel" class="card"></div></section>
    </aside>
  </div>
</div>
<div id="shotTip"></div>
<div id="edgePanel"></div>
<div id="imgModal"></div>
<script src="app.js"></script>
</body>
</html>
